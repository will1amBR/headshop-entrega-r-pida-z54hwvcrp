<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="60%" stop-color="#0D0D0D" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <!-- Subtle Glow for Green Element -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="28" fill="none" stroke="#2A2A2A" stroke-width="2" />
  <rect x="36" y="36" width="1128" height="558" rx="22" fill="none" stroke="#1F1F1F" stroke-width="1" />

  <!-- Left Content Column -->
  <g transform="translate(100, 120)">
    <!-- Brand Badge -->
    <rect x="0" y="0" width="370" height="38" rx="19" fill="#181818" stroke="#333333" stroke-width="1" />
    <circle cx="20" cy="19" r="6" fill="#25D366" />
    <text x="36" y="24" fill="#CCCCCC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">ENTREGA RÁPIDA SP • ENVIO BRASIL</text>

    <!-- Main Title -->
    <text x="0" y="110" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
      HeadShop Entrega
    </text>
    <text x="0" y="176" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
      Rápida &amp; Segura
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="240" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Sedas, dichavadores, bongs, vaporizadores e acessórios originais.
    </text>
    <text x="0" y="270" fill="#999999" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Atendimento imediato e checkout transparente via WhatsApp.
    </text>

    <!-- Features Badges -->
    <g transform="translate(0, 330)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
      <text x="18" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">⚡ SP Express</text>

      <!-- Badge 2 -->
      <rect x="205" y="0" width="220" height="42" rx="10" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
      <text x="223" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">📦 Frete Grátis R$ 299+</text>

      <!-- Badge 3 -->
      <rect x="440" y="0" width="200" height="42" rx="10" fill="#161616" stroke="#2B2B2B" stroke-width="1" />
      <text x="458" y="26" fill="#25D366" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">✓ 100% Originais</text>
    </g>
  </g>

  <!-- Right Graphic Brand Mark -->
  <g transform="translate(860, 160)">
    <rect x="0" y="0" width="230" height="230" rx="44" fill="#141414" stroke="#2E2E2E" stroke-width="2" />
    <!-- Monogram Inside Box -->
    <g transform="translate(45, 45)">
      <rect x="10" y="16" width="20" height="108" rx="6" fill="#FFFFFF" />
      <rect x="110" y="16" width="20" height="108" rx="6" fill="#FFFFFF" />
      <rect x="30" y="58" width="80" height="20" rx="5" fill="#FFFFFF" />
      <!-- Green Lightning -->
      <polygon points="80,0 40,78 76,78 62,140 114,60 78,60" fill="#25D366" filter="url(#glow)" />
    </g>
  </g>
</svg>
