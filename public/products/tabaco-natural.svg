<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="pouchLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#291102" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#d97706" opacity="0.08" />
  
  <g transform="translate(150, 150) rotate(-4)" filter="url(#shadow)">
    <!-- Pouch Body -->
    <rect x="0" y="0" width="300" height="220" rx="14" fill="url(#pouchLeather)" stroke="#92400e" stroke-width="2.5" />
    <!-- Stitching line around edges -->
    <rect x="10" y="10" width="280" height="200" rx="10" fill="none" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="6,4" />
    
    <!-- Tobacco brand badge -->
    <rect x="50" y="50" width="200" height="110" rx="8" fill="#18181b" stroke="#ca8a04" stroke-width="1.5" />
    <text x="150" y="90" fill="#fef08a" font-family="'Impact', 'Arial Black', sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="3">TABACO NATURAL</text>
    <text x="150" y="118" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">DESFIADO FINO VIRGINIA</text>
    <text x="150" y="142" fill="#ca8a04" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BAG 25G COM ZIPLOCK</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">TABACO NATURAL DESFIADO ORGÂNICO</text>
</svg>
