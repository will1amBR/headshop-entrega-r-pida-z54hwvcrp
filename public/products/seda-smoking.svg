<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="smokingBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f21" />
      <stop offset="100%" stop-color="#0a0a0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="240" fill="#18181b" opacity="0.4" />
  
  <g transform="translate(60, 205) rotate(-5)" filter="url(#shadow)">
    <!-- Smoking Deluxe Booklet -->
    <rect x="20" y="0" width="440" height="150" rx="6" fill="url(#smokingBlack)" stroke="#3f3f46" stroke-width="2" />
    <!-- Gold emboss trim line -->
    <rect x="26" y="6" width="428" height="138" rx="4" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.7" />
    
    <!-- Red circle Smoking crest -->
    <circle cx="100" cy="75" r="38" fill="#e11d48" />
    <text x="100" y="86" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" text-anchor="middle">S</text>
    
    <!-- Brand Title -->
    <text x="280" y="78" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="2">Smoking</text>
    <!-- Deluxe in Gold script style -->
    <text x="280" y="112" fill="#d4af37" font-family="'Georgia', serif" font-size="22" font-style="italic" font-weight="bold" letter-spacing="4">DELUXE</text>
    
    <!-- Specs text -->
    <text x="430" y="32" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">KING SIZE SLIM</text>
    <text x="430" y="132" fill="#d4af37" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">ULTRA THIN • 13 g/m²</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">SEDA SMOKING DELUXE KING SIZE</text>
</svg>
