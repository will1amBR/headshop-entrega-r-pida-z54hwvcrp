<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="trayMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#ca8a04" opacity="0.1" />
  
  <g transform="translate(60, 150) rotate(-4)" filter="url(#shadow)">
    <!-- Outer curved tray rim -->
    <rect x="0" y="0" width="480" height="280" rx="36" fill="url(#trayMetal)" stroke="#3f3f46" stroke-width="4" />
    <!-- Inner rolled edge / deep basin -->
    <rect x="24" y="24" width="432" height="232" rx="24" fill="#c99f6e" stroke="#854d0e" stroke-width="3" />
    
    <!-- Artwork on tray -->
    <rect x="36" y="36" width="408" height="208" rx="18" fill="#b88955" />
    <circle cx="240" cy="140" r="60" fill="#291a0f" opacity="0.1" />
    
    <text x="240" y="145" fill="#d82626" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="2">RAW</text>
    <text x="240" y="180" fill="#291a0f" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="4">ROLLING TRAY METAL</text>
    
    <!-- Metallic reflection highlight line across corner -->
    <path d="M 30 50 Q 240 20 450 50" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.4" />
  </g>
  <text x="300" y="530" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">BANDEJA DE ENROLAR METAL COM BORDA CURVA</text>
</svg>
