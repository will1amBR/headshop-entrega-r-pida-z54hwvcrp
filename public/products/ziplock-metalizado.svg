<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="foilBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#a855f7" opacity="0.08" />
  
  <g transform="translate(160, 130)" filter="url(#shadow)">
    <!-- Pouch Body -->
    <rect x="0" y="0" width="280" height="340" rx="14" fill="url(#foilBag)" stroke="#3f3f46" stroke-width="2.5" />
    <!-- Top Hang Hole -->
    <ellipse cx="140" cy="24" rx="16" ry="6" fill="#121214" stroke="#52525b" stroke-width="1.5" />
    
    <!-- Tear notches -->
    <polygon points="0,52 14,48 0,44" fill="#121214" />
    <polygon points="280,52 266,48 280,44" fill="#121214" />
    
    <!-- Zipper Press Seal Line -->
    <line x1="20" y1="62" x2="260" y2="62" stroke="#a855f7" stroke-width="4" stroke-dasharray="8,4" />
    
    <!-- Clear Matte Window -->
    <rect x="35" y="100" width="210" height="150" rx="12" fill="#27272a" stroke="#52525b" stroke-width="2" opacity="0.85" />
    <!-- Botanical pattern inside window -->
    <circle cx="140" cy="175" r="45" fill="#10b981" opacity="0.2" />
    
    <!-- Holographic Anti-odor Badge -->
    <rect x="50" y="270" width="180" height="40" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="1.5" />
    <text x="140" y="295" fill="#e9d5ff" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">ZIPLOCK ANTI-ODOR</text>
  </g>
  <text x="300" y="525" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">SACO ZIPLOCK METALIZADO COM VISOR</text>
</svg>
