<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="kraftCone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#b45309" opacity="0.1" />
  
  <g transform="translate(180, 120)" filter="url(#shadow)">
    <!-- Pack box with pre-rolled cones -->
    <rect x="30" y="20" width="180" height="280" rx="10" fill="url(#kraftCone)" stroke="#52525b" stroke-width="2" />
    <rect x="42" y="32" width="156" height="256" rx="6" fill="#1c1917" />
    
    <!-- 3 Cones peeking out from the top -->
    <polygon points="65,10 85,10 77,120 73,120" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
    <polygon points="110,0 130,0 122,120 118,120" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
    <polygon points="155,10 175,10 167,120 163,120" fill="#fef3c7" stroke="#ca8a04" stroke-width="1.5" />
    
    <!-- RAW Cones brand text -->
    <text x="120" y="170" fill="#dc2626" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="2">RAW</text>
    <text x="120" y="200" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="4">CONES</text>
    <text x="120" y="235" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRÉ-ENROLADOS 3 PACK</text>
    <text x="120" y="255" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">NATURAL UNREFINED</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">CONES PRÉ-ENROLADOS COM PITEIRA</text>
</svg>
