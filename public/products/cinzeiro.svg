<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="ceramicMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#f59e0b" opacity="0.08" />
  
  <g transform="translate(150, 150)" filter="url(#shadow)">
    <!-- Main Circular Ashtray Basin -->
    <ellipse cx="150" cy="150" rx="140" ry="80" fill="url(#ceramicMat)" stroke="#3f3f46" stroke-width="4" />
    <ellipse cx="150" cy="144" rx="120" ry="64" fill="#09090b" stroke="#52525b" stroke-width="2" />
    
    <!-- Deep center well -->
    <ellipse cx="150" cy="150" rx="85" ry="42" fill="#18181b" />
    
    <!-- Cigarette / Joint Resting Grooves (4 indentations) -->
    <!-- Top groove -->
    <rect x="135" y="65" width="30" height="20" rx="6" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <!-- Bottom groove -->
    <rect x="135" y="215" width="30" height="20" rx="6" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <!-- Left groove -->
    <rect x="12" y="140" width="22" height="20" rx="6" fill="#18181b" stroke="#52525b" stroke-width="2" />
    <!-- Right groove -->
    <rect x="266" y="140" width="22" height="20" rx="6" fill="#18181b" stroke="#52525b" stroke-width="2" />
    
    <text x="150" y="156" fill="#d97706" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="3">CINZEIRO PREMIUM</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">CINZEIRO COM 4 APOIOS REFORÇADO</text>
</svg>
