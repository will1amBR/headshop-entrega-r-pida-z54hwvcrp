<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="clipperBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="metalHead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#ea580c" opacity="0.12" />
  
  <g transform="translate(230, 90)" filter="url(#shadow)">
    <!-- Spark wheel teeth (Clipper iconic pentagon/circle shape) -->
    <polygon points="40,25 60,10 85,15 95,38 75,50 48,45" fill="#52525b" stroke="#27272a" stroke-width="2" />
    <!-- Metal hooded guard -->
    <path d="M 30 45 L 110 45 L 110 110 L 30 110 Z" fill="url(#metalHead)" stroke="#3f3f46" stroke-width="2" />
    <!-- Air vents in metal cap -->
    <rect x="42" y="60" width="12" height="24" rx="4" fill="#27272a" />
    <rect x="64" y="60" width="12" height="24" rx="4" fill="#27272a" />
    <rect x="86" y="60" width="12" height="24" rx="4" fill="#27272a" />
    
    <!-- Cylindrical nylon body -->
    <rect x="25" y="110" width="90" height="270" rx="14" fill="url(#clipperBody)" stroke="#7c2d12" stroke-width="2" />
    <!-- Highlight shine -->
    <rect x="35" y="120" width="8" height="250" rx="4" fill="#ffffff" opacity="0.3" />
    
    <!-- Clipper Brand Text rotated -->
    <g transform="translate(75, 290) rotate(-90)">
      <text x="0" y="0" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" letter-spacing="3" text-anchor="middle">CLIPPER</text>
    </g>
    <!-- Base refill valve ring -->
    <rect x="35" y="380" width="70" height="15" rx="5" fill="#27272a" />
  </g>
  <text x="300" y="530" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">ISQUEIRO CLIPPER RECARREGÁVEL</text>
</svg>
