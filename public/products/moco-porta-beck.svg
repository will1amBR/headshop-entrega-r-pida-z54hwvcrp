<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="tubeMat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#a1a1aa" opacity="0.08" />
  
  <g transform="translate(250, 100) rotate(15)" filter="url(#shadow)">
    <!-- Pop Top Cap / Child-resistant Lid -->
    <rect x="0" y="0" width="60" height="34" rx="8" fill="#10b981" stroke="#059669" stroke-width="2" />
    <path d="M 12 16 L 48 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="30" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">SQUEEZE</text>
    
    <!-- Long Tube Body -->
    <rect x="6" y="32" width="48" height="320" rx="8" fill="url(#tubeMat)" stroke="#3f3f46" stroke-width="2" />
    <!-- Tube reflection streak -->
    <line x1="14" y1="40" x2="14" y2="340" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.3" />
    
    <!-- Waterproof / Smell proof badge label -->
    <rect x="8" y="140" width="44" height="100" rx="4" fill="#18181b" stroke="#10b981" stroke-width="1" />
    <g transform="translate(30, 190) rotate(-90)">
      <text x="0" y="3" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="2">PORTA CONE</text>
    </g>
    
    <!-- Round bottom cap -->
    <path d="M 6 345 C 6 360 54 360 54 345 Z" fill="#27272a" stroke="#3f3f46" stroke-width="2" />
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">MOCÓ PORTA-BECK HERMÉTICO ANTI-ODOR</text>
</svg>
