<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#e0f2fe" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#0284c7" opacity="0.1" />
  
  <g transform="translate(140, 250) rotate(-15)" filter="url(#shadow)">
    <!-- Main glass tube -->
    <rect x="0" y="0" width="340" height="64" rx="16" fill="url(#glassBody)" stroke="#38bdf8" stroke-width="3" />
    <!-- Inner pinched cooling balls / constrictions -->
    <circle cx="90" cy="32" r="14" fill="#38bdf8" opacity="0.6" />
    <circle cx="150" cy="32" r="14" fill="#38bdf8" opacity="0.6" />
    <circle cx="210" cy="32" r="14" fill="#38bdf8" opacity="0.6" />
    <!-- Mouthpiece tip rounded flare -->
    <rect x="-12" y="4" width="18" height="56" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
    <!-- Glass reflection line -->
    <line x1="20" y1="16" x2="310" y2="16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- Reducer ring -->
    <rect x="315" y="8" width="20" height="48" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">PITEIRA DE VIDRO BOROSSILICATO 6MM</text>
</svg>
