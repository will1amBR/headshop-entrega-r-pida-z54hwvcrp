    <rect x="28" y="8" width="424" height="134" rx="4" fill="none" stroke="#10b981" stroke-width="2" opacity="0.8" />
    
    <rect x="42" y="26" width="120" height="30" rx="4" fill="#047857" />
    <text x="102" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">QUEIMA LENTA</text>
    
    <text x="260" y="84" fill="#0f172a" font-family="'Impact', 'Arial Black', sans-serif" font-size="46" font-weight="900" letter-spacing="1">SEDA KING SIZE</text>
    <text x="260" y="112" fill="#059669" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3">100% GOMA NATURAL VEGETAL</text>
    
    <text x="430" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="end">32 FOLHAS EXTRA FINAS</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">SEDA KING SIZE PREMIUM</text>
