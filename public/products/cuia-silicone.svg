<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="siliconeMat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#10b981" opacity="0.1" />
  
  <g transform="translate(150, 160)" filter="url(#shadow)">
    <!-- Cuia / Silicone Bowl 3D curve -->
    <path d="M 30 110 C 30 250 270 250 270 110 Z" fill="url(#siliconeMat)" stroke="#065f46" stroke-width="3" />
    <!-- Cuia rim ellipse -->
    <ellipse cx="150" cy="110" rx="120" ry="48" fill="#34d399" stroke="#059669" stroke-width="3" />
    <!-- Inner basin hollow shadow -->
    <ellipse cx="150" cy="114" rx="100" ry="38" fill="#064e3b" />
    
    <!-- Silicone texture lines inside -->
    <ellipse cx="150" cy="120" rx="70" ry="24" fill="#047857" opacity="0.7" />
    <!-- Base footing -->
    <ellipse cx="150" cy="225" rx="55" ry="14" fill="#065f46" />
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">CUIA DE SILICONE ANTIADERENTE CURA</text>
</svg>
