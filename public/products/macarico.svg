<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="torchGun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="steelNozzle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="50%" stop-color="#a1a1aa" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#3b82f6" opacity="0.1" />
  
  <g transform="translate(140, 110)" filter="url(#shadow)">
    <!-- Angled metal burner nozzle -->
    <path d="M 120 70 L 260 40 L 260 85 L 120 100 Z" fill="url(#steelNozzle)" stroke="#3f3f46" stroke-width="2" />
    <!-- Ceramic flame core -->
    <circle cx="260" cy="62" r="14" fill="#0284c7" />
    <circle cx="270" cy="62" r="8" fill="#38bdf8" />
    
    <!-- Torch head / neck housing -->
    <rect x="70" y="60" width="90" height="70" rx="12" fill="url(#torchGun)" stroke="#52525b" stroke-width="2" />
    <!-- Flame lock lever -->
    <rect x="40" y="75" width="35" height="14" rx="4" fill="#ef4444" />
    
    <!-- Pistol grip / tank body -->
    <path d="M 80 120 L 150 120 L 165 310 L 75 310 Z" fill="url(#torchGun)" stroke="#52525b" stroke-width="2" />
    <!-- Grip grooves -->
    <line x1="85" y1="160" x2="145" y2="160" stroke="#3f3f46" stroke-width="3" />
    <line x1="85" y1="190" x2="145" y2="190" stroke="#3f3f46" stroke-width="3" />
    <line x1="85" y1="220" x2="145" y2="220" stroke="#3f3f46" stroke-width="3" />
    
    <!-- Ergonomic trigger -->
    <path d="M 60 145 C 50 160 50 185 65 200 L 80 185 L 80 145 Z" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    
    <!-- Stable Wide Round Base -->
    <ellipse cx="120" cy="315" rx="70" ry="24" fill="#18181b" stroke="#52525b" stroke-width="2" />
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">MAÇARICO JET FLAME RECARREGÁVEL</text>
</svg>
