<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#121214" />
    </radialGradient>
    <linearGradient id="slickColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="300" cy="300" r="230" fill="#6366f1" opacity="0.1" />
  
  <g transform="translate(170, 150)" filter="url(#shadow)">
    <!-- Bottom base cylinder -->
    <path d="M 30 180 C 30 150 230 150 230 180 L 230 250 C 230 290 30 290 30 250 Z" fill="url(#slickColor)" stroke="#4338ca" stroke-width="3" />
    <ellipse cx="130" cy="180" rx="100" ry="34" fill="#a5b4fc" stroke="#6366f1" stroke-width="2" />
    
    <!-- Top lid slightly open / popped on top -->
    <ellipse cx="130" cy="120" rx="104" ry="36" fill="url(#slickColor)" stroke="#4338ca" stroke-width="3" />
    <ellipse cx="130" cy="116" rx="90" ry="28" fill="#818cf8" />
    
    <!-- Volume Capacity badge -->
    <text x="130" y="235" fill="#ffffff" font-family="'Impact', 'Arial Black', sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="2">10 ML</text>
    <text x="130" y="258" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">PLATINUM SILICONE</text>
  </g>
  <text x="300" y="520" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">SLICK SILICONE 10ML CURA PURA</text>
</svg>
